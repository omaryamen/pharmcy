name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install ruff black isort

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Black check
        working-directory: backend
        run: black --check .

      - name: isort check
        working-directory: backend
        run: isort --check-only --profile black --line-length 119 .

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmacloud_test
          POSTGRES_USER: pharmacloud
          POSTGRES_PASSWORD: pharmacloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pharmacloud:pharmacloud@localhost:5432/pharmacloud_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements/testing.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Run pytest
        working-directory: backend
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install pip-audit

      - name: pip-audit
        working-directory: backend
        run: pip-audit -r requirements/base.txt -r requirements/production.txt
