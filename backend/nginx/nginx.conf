# ======================================================================
# PharmaCloud ERP — Nginx reverse proxy (production)
# Serves static/media directly and proxies the API to the Django app.
# ======================================================================
upstream pharmacloud_app {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS (TLS terminated upstream).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # Provide real certificates via certbot/secrets; below is a placeholder.
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # --- Static / media ---
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- API ---
    location /api/ {
        proxy_pass http://pharmacloud_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Admin ---
    location /admin/ {
        proxy_pass http://pharmacloud_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health probes (no auth, used by orchestrators) ---
    location /api/v1/health/ {
        proxy_pass http://pharmacloud_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }
}
