# ======================================================================
# PharmaCloud ERP — Unified Production Stack (Backend, Frontend, DB, Redis, Celery, Nginx)
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ======================================================================
name: pharmacloud-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: pharmacloud
      POSTGRES_USER: ${POSTGRES_USER:-pharmacloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmacloud} -d pharmacloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me-in-production}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me-in-production} ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pharmacloud}:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/pharmacloud
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/2
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A config worker -l INFO --concurrency=8
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pharmacloud}:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/pharmacloud
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/2
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pharmacloud}:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/pharmacloud
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/2
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-https://pharmacloud.app/api/v1}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  static_volume:
  media_volume:
